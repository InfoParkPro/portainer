name: Deploy build

on:
  push:
    branches:
      - deploy
  pull_request:
    branches:
      - deploy

permissions:
  contents: read

jobs:
  build:
    name: Build Portainer
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and server
        run: make build-all ENV=production PLATFORM=linux ARCH=amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --load \
            --tag infopark-portainer:${{ github.sha }} \
            --file build/linux/Dockerfile \
            .
